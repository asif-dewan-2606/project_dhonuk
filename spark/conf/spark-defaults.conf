# ==========================================================
# Iceberg Extensions
# ==========================================================
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ==========================================================
# Polaris REST Catalog
# ==========================================================
spark.sql.catalog.polaris=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.type=rest
spark.sql.catalog.polaris.uri=http://polaris:8181/api/catalog
spark.sql.catalog.polaris.warehouse=raw

# ==========================================================
# Polaris Authentication
# ==========================================================
spark.sql.catalog.polaris.rest.auth.type=oauth2
spark.sql.catalog.polaris.credential=root:s3cr3t
spark.sql.catalog.polaris.scope=PRINCIPAL_ROLE:ALL
spark.sql.catalog.polaris.oauth2-server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens

# ==========================================================
# Iceberg FileIO (AWS SDK)
# ==========================================================
spark.sql.catalog.polaris.io-impl=org.apache.iceberg.aws.s3.S3FileIO

# Region
spark.sql.catalog.polaris.client.region=us-east-1
spark.sql.catalog.polaris.s3.region=us-east-1

# S3 Endpoint
spark.sql.catalog.polaris.s3.endpoint=http://ozone-s3g:9878
spark.sql.catalog.polaris.s3.path-style-access=true

# Credentials
spark.sql.catalog.polaris.s3.access-key-id=ozone
spark.sql.catalog.polaris.s3.secret-access-key=ozone

# ==========================================================
# Hadoop S3A (Spark reads)
# ==========================================================
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint=http://ozone-s3g:9878
spark.hadoop.fs.s3a.access.key=ozone
spark.hadoop.fs.s3a.secret.key=ozone
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.endpoint.region=us-east-1
spark.hadoop.fs.s3a.aws.region=us-east-1