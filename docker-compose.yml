name: dhonuk

x-airflow-common: &airflow-common
  image: dhonuk-airflow:3.1.6

  env_file:
    - .env
  environment:
    AIRFLOW_UID: "50000"
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/project/dbt
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - dhonuk-network

x-producer-common: &producer-common
  image: dhonuk-producer:1.0

  env_file:
    - .env
  depends_on:
    kafka:
      condition: service_started
  networks:
    - dhonuk-network

x-consumer-common: &consumer-common
  image: dhonuk-consumer:1.0

  env_file:
    - .env

  depends_on:
    kafka:
      condition: service_started

    clickhouse:
      condition: service_started

  networks:
    - dhonuk-network


services:

  postgres-airflow:
    image: postgres:16.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dhonuk-network

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      
      # Retention
      KAFKA_LOG_RETENTION_HOURS: 10
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - dhonuk-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - dhonuk-network

  kafka-connect:
    build:
      context: .
      dockerfile: images/kafka-connect/Dockerfile

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_started

    ports:
      - "8083:8083"

    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: dhonuk-connect

      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/etc/kafka-connect/jars

      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect

    volumes:
      - ./kafka/connect:/etc/kafka-connect/connectors
      - ./kafka/plugins:/etc/kafka-connect/jars

    networks:
      - dhonuk-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.6.8
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dhonuk
      CLICKHOUSE_PASSWORD: dhonuk123

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    networks:
      - dhonuk-network

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username airflow --password airflow --firstname Airflow --lastname Admin --role Admin --email airflow@example.com
      "

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  producer:
    <<: *producer-common
    build:
      context: .
      dockerfile: images/producer/Dockerfile

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sales_transactions
    volumes:
      - ./producer/src:/app/src
    command: python /app/src/main.py
    
  consumer:
    <<: *consumer-common

    build:
      context: .
      dockerfile: images/consumer/Dockerfile

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: sales_transactions

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: dhonuk
      CLICKHOUSE_PASSWORD: dhonuk123

    volumes:
      - ./consumer/src:/app/src
      - ./consumer/config:/app/config

    command: python /app/src/main.py


networks:
  dhonuk-network:
    driver: bridge

volumes:
  postgres_airflow_data:
  clickhouse_data:
  kafka_data: