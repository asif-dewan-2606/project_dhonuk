name: dhonuk

x-producer-common: &producer-common
  image: dhonuk-producer:1.0

  env_file:
    - .env
  depends_on:
    kafka:
      condition: service_started

    ozone-bootstrap:
      condition: service_started
  networks:
    - dhonuk-network

x-consumer-common: &consumer-common
  image: dhonuk-consumer:1.0

  env_file:
    - .env

  depends_on:
    kafka:
      condition: service_started

    clickhouse:
      condition: service_started

    ozone-bootstrap:
      condition: service_started

  networks:
    - dhonuk-network


services:

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Retention
      KAFKA_LOG_RETENTION_HOURS: 10
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - dhonuk-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - dhonuk-network

  # Polls Oracle/Postgres directly via JDBC (no CDC/Debezium in front of
  # them yet) and produces straight to Kafka. Connector configs live in
  # producer/connectors/*.json - register them with producer/connectors/register.sh
  # once this is up. Offsets are tracked internally by Connect (in the
  # _connect-offsets topic below), so nothing here needs its own state file.
  kafka-connect:
    build:
      context: .
      dockerfile: images/kafka-connect/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: dhonuk-connect

      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components

    # volumes:
    #   # Oracle driver jar you download yourself (see images/kafka-connect/Dockerfile)
    #   # - ./producer/connect-drivers:/usr/share/confluent-hub-components/confluentinc-kafka-connect-jdbc/lib/oracle

    networks:
      - dhonuk-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.6.8
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dhonuk
      CLICKHOUSE_PASSWORD: dhonuk123

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    networks:
      - dhonuk-network


  scm:
    image: apache/ozone:2.0.0
    container_name: ozone-scm
    restart: unless-stopped
    command: ["ozone", "scm"]

    environment:
      OZONE-SITE.XML_hdds.datanode.dir: /data/hdds
      OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata

      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.scm.client.address: scm
      OZONE-SITE.XML_ozone.scm.block.client.address: scm

      OZONE-SITE.XML_ozone.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication.type: RATIS

      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION



    ports:
      - "9876:9876"

    volumes:
      - ozone_scm:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9876 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - dhonuk-network

  om:
    image: apache/ozone:2.0.0
    container_name: ozone-om
    restart: unless-stopped
    command: ["ozone", "om"]

    environment:
      OZONE-SITE.XML_hdds.datanode.dir: /data/hdds
      OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata
      OZONE-SITE.XML_ozone.om.address: om
      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.scm.client.address: scm
      OZONE-SITE.XML_ozone.scm.block.client.address: scm
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE-SITE.XML_ozone.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication.type: RATIS

    ports:
      - "9874:9874"

    volumes:
      - ozone_om:/data

    depends_on:
      scm:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9874 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - dhonuk-network


  datanode:
    image: apache/ozone:2.0.0
    container_name: ozone-datanode
    restart: unless-stopped
    command: ["ozone", "datanode"]

    environment:
      OZONE-SITE.XML_hdds.datanode.dir: /data/hdds
      OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata
      OZONE-SITE.XML_ozone.om.address: om
      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.scm.client.address: scm
      OZONE-SITE.XML_ozone.scm.block.client.address: scm
      OZONE-SITE.XML_ozone.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication.type: RATIS

    ports:
      - "9882:9882"

    volumes:
      - ozone_dn:/data

    depends_on:
      scm:
        condition: service_healthy
      om:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9882 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - dhonuk-network
  
  ozone-s3g:
    image: apache/ozone:2.0.0
    container_name: ozone-s3g
    restart: unless-stopped
    command: ["ozone", "s3g"]

    environment:
      OZONE-SITE.XML_ozone.om.address: om
      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication.type: RATIS

    ports:
      - "9878:9878"

    depends_on:
      om:
        condition: service_healthy
      datanode:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9878 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - dhonuk-network

  ozone-bootstrap:
    image: dhonuk-consumer:1.0
    container_name: ozone-bootstrap

    restart: "no"

    env_file:
      - .env

    environment:
      OZONE_ENDPOINT: http://ozone-s3g:9878
      AWS_ACCESS_KEY_ID: ozone
      AWS_SECRET_ACCESS_KEY: ozone

    volumes:
      - ./bootstrap:/app/bootstrap

    command: python /app/bootstrap/ozone_bootstrap.py

    depends_on:
      ozone-s3g:
        condition: service_started

    networks:
      - dhonuk-network

  recon:
    image: apache/ozone:2.0.0
    container_name: ozone-recon
    restart: unless-stopped
    command: ["ozone", "recon"]

    environment:
      OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata
      OZONE-SITE.XML_ozone.om.address: om
      OZONE-SITE.XML_ozone.scm.names: scm
      OZONE-SITE.XML_ozone.scm.client.address: scm
      OZONE-SITE.XML_ozone.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication: "1"
      OZONE-SITE.XML_ozone.server.default.replication.type: RATIS

    ports:
      - "9888:9888"

    volumes:
      - ozone_recon:/data

    depends_on:
      scm:
        condition: service_healthy
      om:
        condition: service_healthy

    networks:
      - dhonuk-network

  polaris-db:
    image: postgres:16
    container_name: polaris-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris123

    ports:
      - "5433:5432"

    volumes:
      - polaris_db:/var/lib/postgresql/data

    networks:
      - dhonuk-network

  polaris:
    image: apache/polaris:latest
    container_name: polaris
    restart: unless-stopped

    depends_on:
      - polaris-db

    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc

      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-db:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris123
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ozone
      AWS_SECRET_ACCESS_KEY: ozone

    ports:
      - "8181:8181"

    networks:
      - dhonuk-network

  producer:
    <<: *producer-common
    build:
      context: .
      dockerfile: images/producer/Dockerfile

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sales_transactions}
      PYTHONPATH: /app/src
    volumes:
      - ./producer/src:/app/src
    command: python /app/src/main.py

  consumer:
    <<: *consumer-common
    restart: unless-stopped

    build:
      context: .
      dockerfile: images/consumer/Dockerfile

    environment:
      # Consumed by pipelines.yaml / application.yaml via ${VAR} interpolation
      # (that substitution happens in config.py, at container startup - a
      # different mechanism than compose's own ${VAR:-default} above, but
      # both ultimately read from the same .env-sourced value).
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sales_transactions}
      CLICKHOUSE_PASSWORD: dhonuk123
      POSTGRES_USER: dhonuk
      POSTGRES_PASSWORD: dhonuk123
      OZONE_ENDPOINT: http://ozone-s3g:9878
      OZONE_VOLUME: analytics
      OZONE_BUCKET: raw
      AWS_ACCESS_KEY_ID: ozone
      AWS_SECRET_ACCESS_KEY: ozone
      PYTHONPATH: /app/src

    volumes:
      - ./consumer/src:/app/src
      - ./bootstrap:/app/bootstrap

    command: python /app/src/main.py

  trino:
    image: trinodb/trino:477
    container_name: trino

    restart: unless-stopped

    ports:
      - "8085:8080"

    volumes:
      - ./trino/catalog:/etc/trino/catalog

    depends_on:
      - polaris

    networks:
      - dhonuk-network

  spark:
    build:
      context: .
      dockerfile: images/spark/Dockerfile

    container_name: spark
    restart: unless-stopped

    tty: true
    stdin_open: true

    working_dir: /app

    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ozone
      AWS_SECRET_ACCESS_KEY: ozone

    volumes:
      - ./spark/src:/app/src
      - ./spark/conf:/opt/spark/conf
      - ./spark/jars:/opt/spark/jars/custom   # <-- add this back if your jars are on the host

    command: tail -f /dev/null

    depends_on:
      polaris:
        condition: service_started
      ozone-s3g:
        condition: service_started

    networks:
      - dhonuk-network
  
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver

    restart: unless-stopped

    ports:
      - "8978:8978"

    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

    depends_on:
      - trino

    networks:
      - dhonuk-network
    
      

networks:
  dhonuk-network:
    driver: bridge

volumes:
  clickhouse_data:
  kafka_data:

  ozone_scm:
  ozone_om:
  ozone_dn:
  ozone_recon:
  polaris_db:
  cloudbeaver_data:
