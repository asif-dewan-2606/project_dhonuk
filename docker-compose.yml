name: dhonuk

x-producer-common: &producer-common
  image: dhonuk-producer:1.0

  env_file:
    - .env
  depends_on:
    kafka:
      condition: service_started
  networks:
    - dhonuk-network

x-consumer-common: &consumer-common
  image: dhonuk-consumer:1.0

  env_file:
    - .env

  depends_on:
    kafka:
      condition: service_started

    clickhouse:
      condition: service_started

  networks:
    - dhonuk-network


services:

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Retention
      KAFKA_LOG_RETENTION_HOURS: 10
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - dhonuk-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - dhonuk-network

  # Polls Oracle/Postgres directly via JDBC (no CDC/Debezium in front of
  # them yet) and produces straight to Kafka. Connector configs live in
  # producer/connectors/*.json - register them with producer/connectors/register.sh
  # once this is up. Offsets are tracked internally by Connect (in the
  # _connect-offsets topic below), so nothing here needs its own state file.
  kafka-connect:
    build:
      context: .
      dockerfile: images/kafka-connect/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: dhonuk-connect

      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components

    # volumes:
    #   # Oracle driver jar you download yourself (see images/kafka-connect/Dockerfile)
    #   # - ./producer/connect-drivers:/usr/share/confluent-hub-components/confluentinc-kafka-connect-jdbc/lib/oracle

    networks:
      - dhonuk-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.6.8
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dhonuk
      CLICKHOUSE_PASSWORD: dhonuk123

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    networks:
      - dhonuk-network

  producer:
    <<: *producer-common
    build:
      context: .
      dockerfile: images/producer/Dockerfile

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sales_transactions}
      PYTHONPATH: /app/src
    volumes:
      - ./producer/src:/app/src
    command: python /app/src/main.py

  consumer:
    <<: *consumer-common
    restart: unless-stopped

    build:
      context: .
      dockerfile: images/consumer/Dockerfile

    environment:
      # Consumed by pipelines.yaml / application.yaml via ${VAR} interpolation
      # (that substitution happens in config.py, at container startup - a
      # different mechanism than compose's own ${VAR:-default} above, but
      # both ultimately read from the same .env-sourced value).
      KAFKA_TOPIC: ${KAFKA_TOPIC:-sales_transactions}
      CLICKHOUSE_PASSWORD: dhonuk123
      POSTGRES_USER: dhonuk
      POSTGRES_PASSWORD: dhonuk123
      OZONE_ENDPOINT: ""
      OZONE_BUCKET: ""
      PYTHONPATH: /app/src

    volumes:
      - ./consumer/src:/app/src

    command: python /app/src/main.py


networks:
  dhonuk-network:
    driver: bridge

volumes:
  clickhouse_data:
  kafka_data:
